apiVersion: tekton.dev/v1beta1
kind: Task

metadata:
  name: flake8

spec:
  workspaces:
    - name: source

  params:
    - name: args
      type: string
      description: Arguments to pass to flake8
      default: ""

  steps:
    - name: flake8
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e

        python -m pip install --upgrade pip
        pip install -r requirements.txt

        flake8 $(params.args)